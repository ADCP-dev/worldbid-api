# ─── Task Activity resource (showcase: list view, audit log) ─────────────────
# Demonstrates:
#   - `ui.view: list` (compact vertical record list via SpecList)
#   - enum field for the action type
#   - ref→task CASCADE, ref→user SET NULL
#   - row-level filter for the user role (a user sees only their own activity)

name: tasks
version: 2.0.0

resources:
  - name: task-activity
    table: ext_tasks_task_activity
    displayName: Task Activity
    description: Audit log of task lifecycle events
    timestamps: true
    softDelete: false

    fields:
      - name: action
        type: enum
        required: true
        enum: [created, updated, deleted, commented]
        index: true
        ui:
          display: badge
          formInput: select
          colors:
            created: '#22c55e'
            updated: '#3b82f6'
            deleted: '#ef4444'
            commented: '#8b5cf6'
          section: basics
          order: 1
          filterable: true
          sortable: true
          filterType: select

      - name: description
        type: text
        required: true
        validation:
          min: 1
          max: 1000
        ui:
          display: truncate
          truncateLength: 100
          formInput: textarea
          section: basics
          order: 2
          cols: 2
          placeholder: 'What happened…'
          helpText: 'Short human-readable description of the event.'

      - name: userId
        type: ref
        ref: user
        nullable: true
        refOnDelete: SET NULL
        index: true
        ui:
          display: avatar
          formInput: select-async
          labelField: firstName
          section: basics
          order: 3
          placeholder: 'Who triggered the event'

      - name: taskId
        type: ref
        ref: task
        required: true
        refOnDelete: CASCADE
        index: true
        ui:
          formInput: select-async
          labelField: title
          section: basics
          order: 4

    permissions:
      list: [admin, user, manager]
      read: [admin, user, manager]
      create: [admin, manager]
      update: [admin]
      delete: [admin]
      rowLevel:
        user:
          filter: 'userId == ${user.id}'

    seeds:
      - action: created
        description: 'Task "Setup project repository" created'
        taskId: 1
      - action: updated
        description: 'Task "Design database schema" moved to in_progress'
        taskId: 2
      - action: commented
        description: 'Comment on "Write API documentation": need more detail'
        taskId: 3
      - action: updated
        description: 'Task "Deploy staging environment" blocked'
        taskId: 4

    ui:
      icon: History
      view: list