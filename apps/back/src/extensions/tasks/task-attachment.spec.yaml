# ─── Task Attachment resource (showcase: file upload single + multiple) ──────
# Demonstrates:
#   - `file` field type with a single file (`file` field, ui.multiple omitted)
#   - `file` field type with multiple files (`files` field, ui.multiple=true)
#   - accept mime filter coexisting with allowedMimes (intersection)
#   - ref→task CASCADE so attachments are deleted with the task

name: tasks
version: 2.0.0

resources:
  - name: task-attachment
    table: ext_tasks_task_attachment
    displayName: Task Attachment
    description: Files attached to a task
    timestamps: true
    softDelete: true

    fields:
      - name: filename
        type: string
        required: true
        length: 255
        ui:
          display: text
          formInput: text
          link: true
          section: basics
          order: 1
          placeholder: 'report-q3.pdf'
          helpText: 'Human-readable file name shown in the UI.'

      - name: taskId
        type: ref
        ref: task
        required: true
        refOnDelete: CASCADE
        index: true
        ui:
          formInput: select-async
          labelField: title
          section: basics
          order: 2

      - name: file
        type: file
        nullable: true
        storage: local
        allowedMimes:
          - application/pdf
          - text/plain
          - application/zip
        maxSize: 10485760  # 10 MB
        ui:
          display: text
          formInput: file-upload
          section: files
          order: 3
          cols: 2
          accept: '.pdf,.txt,.zip'
          helpText: 'A single supporting document (PDF/TXT/ZIP, ≤10MB).'

      - name: files
        type: file
        nullable: true
        storage: local
        allowedMimes:
          - image/png
          - image/jpeg
          - image/webp
          - image/gif
        maxSize: 5242880  # 5 MB per file
        ui:
          display: text
          formInput: file-upload
          section: files
          order: 4
          cols: 2
          multiple: true
          accept: 'image/*'
          helpText: 'One or more images (PNG/JPEG/WebP/GIF, ≤5MB each).'

    permissions:
      list: [admin, user, manager]
      read: [admin, user, manager]
      create: [admin, user, manager]
      update: [admin, manager]
      delete: [admin, manager]
      # TODO: join-aware rowLevel (filter by task.assigneeId == user.id) — follow-up

    seeds:
      - filename: spec-v2-overview.pdf
        taskId: 1
      - filename: screenshots-batch.zip
        taskId: 2

    ui:
      icon: Paperclip
      view: table
      sections:
        - id: basics
          title: Basics
          icon: Info
          cols: 2
        - id: files
          title: Files
          icon: Upload
          cols: 2