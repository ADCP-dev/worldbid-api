# ─── Task Note resource (collaborative notes on a task) ─────────────────────
# Demonstrates:
#   - text field with validation (min/max length)
#   - ref→user SET NULL (author), ref→task CASCADE (parent task)
#   - row-level filter for user/manager roles (sees only own notes)
#   - afterCreate hook (notify task assignee)
#   - idempotent seeds (fixed ids, cycles authors 1/2/1)
#
# Extension-level concerns (roles, roleSeeds) live in tasks.extension.spec.yaml.

name: tasks
version: 2.0.0

resources:
  - name: task-note
    table: ext_tasks_task_note
    displayName: Task Note
    description: Collaborative note attached to a task
    timestamps: true
    softDelete: true

    fields:
      - name: content
        type: text
        required: true
        validation:
          min: 5
          max: 2000

      - name: authorId
        type: ref
        ref: user
        nullable: true
        refOnDelete: SET NULL
        index: true

      - name: taskId
        type: ref
        ref: task
        required: true
        refOnDelete: CASCADE
        index: true

    permissions:
      list: [admin, user, manager]
      read: [admin, user, manager]
      create: [admin, user, manager]
      update: [admin, user, manager]
      delete: [admin, user, manager]
      rowLevel:
        user:
          filter: 'authorId == ${user.id}'
        manager:
          filter: 'authorId == ${user.id}'
        # admin: no rowLevel entry → bypasses (sees all)

    hooks:
      afterCreate: ./hooks/task-note-after-create.ts

    seeds:
      - content: 'Looks good to me, shipping it.'
        authorId: 1
        taskId: 1
      - content: 'Need to clarify the acceptance criteria first.'
        authorId: 2
        taskId: 2
      - content: 'Blocked on the auth refactor — waiting on review.'
        authorId: 1
        taskId: 3