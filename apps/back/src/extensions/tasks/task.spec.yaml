# ─── Task resource (canonical demanding example) ─────────────────────────────
# This file defines ONLY the `task` resource — the kanban board centerpiece.
# It showcases every spec-engine v2 feature: sections, steps, showIf, cols,
# order, placeholder, helpText, multiple/accept file hints, password/secret,
# switch, stepper, kanban view, row-level + field-level permissions, hooks,
# notifications (incl. job-triggered), jobs (interval + cron), webhooks (HMAC),
# and a rich seed set.
#
# Extension-level concerns (name, version, roles, roleSeeds, views) live in
# `tasks.extension.spec.yaml`.

name: tasks
version: 2.0.0

resources:
  - name: task
    table: ext_tasks_task
    displayName: Task
    description: A kanban task card
    timestamps: true
    softDelete: true

    fields:
      # ── Basics section ──
      - name: title
        type: string
        required: true
        length: 200
        validation:
          min: 2
          max: 200
        ui:
          display: text
          formInput: text
          link: true
          section: basics
          order: 1
          cols: 2
          placeholder: 'e.g. Refactor auth module'
          helpText: 'Short, actionable summary of the work.'

      - name: description
        type: text
        nullable: true
        ui:
          display: truncate
          truncateLength: 50
          formInput: textarea
          section: basics
          order: 2
          cols: 2
          placeholder: 'Add context, acceptance criteria, links…'
          helpText: 'Markdown is supported in the detail view.'

      - name: status
        type: enum
        required: true
        default: pending
        enum: [pending, in_progress, review, done, blocked]
        index: true
        ui:
          display: badge
          formInput: select
          colors:
            pending: '#f59e0b'
            in_progress: '#3b82f6'
            review: '#8b5cf6'
            done: '#22c55e'
            blocked: '#ef4444'
          section: basics
          order: 3
          filterable: true
          sortable: true
          filterType: select

      - name: priority
        type: enum
        required: true
        default: medium
        enum: [low, medium, high, urgent]
        index: true
        ui:
          display: badge
          formInput: select
          colors:
            low: '#6b7280'
            medium: '#3b82f6'
            high: '#f59e0b'
            urgent: '#ef4444'
          section: basics
          order: 4
          filterable: true
          sortable: true
          filterType: select

      # ── Assignment & Dates section ──
      - name: assigneeId
        type: ref
        ref: user
        nullable: true
        refOnDelete: SET NULL
        index: true
        ui:
          display: avatar
          formInput: select-async
          labelField: firstName
          section: assignment
          order: 5
          placeholder: 'Search a user…'
          helpText: 'The person responsible for moving this task forward.'

      - name: reporterId
        type: ref
        ref: user
        nullable: true
        refOnDelete: SET NULL
        index: true
        ui:
          display: avatar
          formInput: select-async
          labelField: firstName
          section: assignment
          order: 6
          placeholder: 'Search a user…'
          helpText: 'Who created/requested this task.'

      - name: dueDate
        type: datetime
        nullable: true
        index: true
        ui:
          display: date
          formInput: datepicker
          section: assignment
          order: 7
          placeholder: 'Pick a due date'
          helpText: 'When the task should be done.'

      - name: position
        type: integer
        default: 0
        ui:
          display: text
          formInput: stepper
          section: assignment
          order: 8
          helpText: 'Card order inside its kanban column.'
          sortable: true

      - name: estimateHours
        type: decimal
        nullable: true
        precision: 10
        scale: 2
        ui:
          display: text
          formInput: text
          section: assignment
          order: 9
          placeholder: '8.5'
          helpText: 'Estimated effort in hours (e.g. 0.5, 8, 40).'

      # ── Extra section (metadata, recurrence, secrets, files) ──
      - name: metadata
        type: json
        default: {}
        ui:
          section: extra
          order: 10
          helpText: 'Free-form key/value metadata.'

      - name: isRecurring
        type: boolean
        default: false
        ui:
          display: text
          formInput: switch
          section: extra
          order: 11
          helpText: 'Does this task repeat on a schedule?'

      - name: recurrenceRule
        type: string
        nullable: true
        length: 200
        ui:
          display: text
          formInput: text
          section: extra
          order: 12
          cols: 2
          placeholder: 'FREQ=WEEKLY;BYDAY=MO,FR'
          helpText: 'iCalendar-style recurrence rule (RFC 5545).'
          showIf:
            isRecurring: true

      - name: apiKey
        type: password
        nullable: true
        length: 255
        ui:
          formInput: text
          section: extra
          order: 13
          placeholder: 'Secret token used by integrations'
          helpText: 'Stored masked; never returned in full by the API.'

      - name: attachment
        type: file
        nullable: true
        storage: local
        allowedMimes: ['application/pdf', 'text/plain']
        ui:
          display: text
          formInput: file-upload
          section: extra
          order: 14
          accept: '.pdf,.txt'
          helpText: 'A single supporting document.'

      - name: coverImage
        type: file
        nullable: true
        storage: local
        allowedMimes: ['image/png', 'image/jpeg', 'image/webp']
        ui:
          display: text
          formInput: file-upload
          section: extra
          order: 15
          multiple: true
          accept: 'image/*'
          helpText: 'One or more cover images.'

    permissions:
      list: [admin, user, manager]
      read: [admin, user, manager]
      create: [admin, manager]
      update: [admin, user, manager]
      delete: [admin]
      fields:
        position:
          read: [admin, manager]
          write: [admin, manager]
        apiKey:
          read: [admin]
          write: [admin]
        assigneeId:
          read: [admin, user, manager]
      rowLevel:
        user:
          filter: 'assigneeId == ${user.id}'
        manager:
          filter: 'assigneeId == ${user.id}'

    hooks:
      beforeCreate: ./hooks/task-before-create.ts
      afterCreate: ./hooks/task-after-create.ts
      afterUpdate: ./hooks/task-after-update.ts

    notifications:
      - name: notify-assignee
        trigger:
          on: afterCreate
          when: 'assigneeId != null'
        channel: email
        template: ./templates/task-assigned.hbs
        to: '${app.notificationEmail}'
        subject: 'Nueva tarea asignada: ${entity.title}'

      - name: notify-status-change
        trigger:
          on: afterUpdate
          when: 'changed.status != null'
        channel: email
        template: ./templates/task-assigned.hbs
        to: '${app.notificationEmail}'
        subject: 'Tarea "${entity.title}" cambió de estado'

      - name: notify-stale
        trigger:
          on: job
          jobName: stale-tasks-detector
        channel: email
        template: ./templates/stale-tasks.hbs
        to: '${app.notificationEmail}'
        subject: 'Tareas pendientes sin actualizar'

      - name: notify-overdue
        trigger:
          on: job
          jobName: overdue-tasks-detector
        channel: email
        template: ./templates/stale-tasks.hbs
        to: '${app.notificationEmail}'
        subject: 'Tareas vencidas'

    jobs:
      - name: stale-tasks-detector
        schedule: interval
        value: 60s
        handler: ./handlers/stale-tasks.handler.ts
        queue: spec-jobs
        retries: 3
        backoff: exponential

      - name: overdue-tasks-detector
        schedule: cron
        value: '0 8 * * *'
        handler: ./handlers/overdue-tasks.handler.ts
        queue: spec-jobs
        retries: 3
        backoff: fixed

    webhooks:
      - name: stale-alert
        path: tasks/webhooks/stale
        method: POST
        auth: hmac
        handler: ./handlers/stale-webhook.handler.ts

      - name: status-change
        path: tasks/webhooks/status-change
        method: POST
        auth: hmac
        handler: ./handlers/status-change-webhook.handler.ts

    seeds:
      - title: Setup project repository
        status: done
        priority: high
        position: 0
        estimateHours: 4
        isRecurring: false
        assigneeId: 1
        reporterId: 2
      - title: Design database schema
        status: in_progress
        priority: medium
        position: 1
        estimateHours: 8
        dueDate: '2026-08-10T00:00:00Z'
        assigneeId: 2
        reporterId: 1
      - title: Write API documentation
        status: pending
        priority: low
        position: 2
        estimateHours: 6
        assigneeId: 1
        reporterId: 1
      - title: Deploy staging environment
        status: blocked
        priority: urgent
        dueDate: '2026-08-15T00:00:00Z'
        position: 3
        estimateHours: 2
        assigneeId: 2
        reporterId: 1
      - title: Weekly metrics review
        status: pending
        priority: medium
        position: 4
        isRecurring: true
        recurrenceRule: 'FREQ=WEEKLY;BYDAY=MO'
        assigneeId: 1
        reporterId: 2
      - title: Refactor auth module
        status: review
        priority: high
        position: 5
        estimateHours: 16
        dueDate: '2026-08-20T00:00:00Z'
        assigneeId: 2
        reporterId: 1
      - title: Migrate to new S3 SDK
        status: in_progress
        priority: urgent
        position: 6
        estimateHours: 12
        assigneeId: 1
        reporterId: 2
      - title: Customer onboarding checklist
        status: pending
        priority: low
        position: 7
        isRecurring: true
        recurrenceRule: 'FREQ=MONTHLY;BYMONTHDAY=1'
        assigneeId: 2
        reporterId: 1

    ui:
      icon: CheckSquare
      view: kanban
      kanbanColumn: status
      kanbanOrder: position
      sidebar:
        heading: Tasks
        items:
          - title: All Tasks
            icon: CheckSquare
            link: /app/tasks
            roles: [admin]
          - title: My Tasks
            icon: User
            link: /app/tasks/mine
            roles: [user, manager]
          - title: Team Overview
            icon: Users
            link: /app/tasks/team
            roles: [manager]
      sections:
        - id: basics
          title: Basics
          icon: Info
          cols: 2
        - id: assignment
          title: Assignment & Dates
          icon: Calendar
          cols: 2
        - id: extra
          title: Extra
          icon: Settings
          cols: 2
      steps:
        - id: what
          title: What
          icon: FileText
          fields: [title, description, status, priority]
          section: basics
        - id: who-when
          title: Who & When
          icon: Users
          fields: [assigneeId, reporterId, dueDate, position, estimateHours]
          section: assignment
        - id: meta
          title: Meta
          icon: Settings
          fields: [metadata, isRecurring, recurrenceRule, apiKey, attachment, coverImage]
          section: extra