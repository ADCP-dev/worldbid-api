# ─── Task resource (canonical demanding example) ─────────────────────────────
# This file defines ONLY the `task` resource — the kanban board centerpiece.
# It showcases every spec-engine v2 backend feature: row-level + field-level
# permissions, hooks, notifications (incl. job-triggered), jobs (interval +
# cron), webhooks (HMAC), and a rich seed set.
#
# Extension-level concerns (name, version, roles, roleSeeds) live in
# `tasks.extension.spec.yaml`.

name: tasks
version: 2.0.0

resources:
  - name: task
    table: ext_tasks_task
    displayName: Task
    description: A kanban task card
    timestamps: true
    softDelete: true

    fields:
      # ── Basics ──
      - name: title
        type: string
        required: true
        length: 200
        validation:
          min: 2
          max: 200

      - name: description
        type: text
        nullable: true

      - name: status
        type: enum
        required: true
        default: pending
        enum: [pending, in_progress, review, done, blocked]
        index: true

      - name: priority
        type: enum
        required: true
        default: medium
        enum: [low, medium, high, urgent]
        index: true

      # ── Assignment & Dates ──
      - name: assigneeId
        type: ref
        ref: user
        nullable: true
        refOnDelete: SET NULL
        index: true

      - name: reporterId
        type: ref
        ref: user
        nullable: true
        refOnDelete: SET NULL
        index: true

      - name: dueDate
        type: datetime
        nullable: true
        index: true

      - name: position
        type: integer
        default: 0

      - name: estimateHours
        type: decimal
        nullable: true
        precision: 10
        scale: 2

      # ── Extra (metadata, recurrence, secrets, files) ──
      - name: metadata
        type: json
        default: {}

      - name: isRecurring
        type: boolean
        default: false

      - name: recurrenceRule
        type: string
        nullable: true
        length: 200

      - name: apiKey
        type: password
        nullable: true
        length: 255

      - name: attachment
        type: file
        nullable: true
        storage: local
        allowedMimes: ['application/pdf', 'text/plain']

      - name: coverImage
        type: file
        nullable: true
        storage: local
        allowedMimes: ['image/png', 'image/jpeg', 'image/webp']

      # ── Tagging (added by change tasks-v2-professional) ──
      - name: tags
        type: json
        nullable: true
        default: {}

    permissions:
      list: [admin, user, manager]
      read: [admin, user, manager]
      create: [admin, manager]
      update: [admin, user, manager]
      delete: [admin]
      fields:
        position:
          read: [admin, manager]
          write: [admin, manager]
        apiKey:
          read: [admin]
          write: [admin]
        assigneeId:
          read: [admin, user, manager]
      rowLevel:
        user:
          filter: 'assigneeId == ${user.id}'
        manager:
          filter: 'assigneeId == ${user.id}'

    hooks:
      beforeCreate: ./hooks/task-before-create.ts
      afterCreate: ./hooks/task-after-create.ts
      afterUpdate: ./hooks/task-after-update.ts

    # ── Custom actions (added by change tasks-v2-professional) ──
    # Handlers are loaded via require() by SpecEngineActionFactory and receive
    # (entityId, input, ctx). Auth is enforced via @Roles + jwt + RolesGuard.
    # `stats` is read-like (all task roles); `reorder`/`bulk-status` mutate.
    actions:
      - name: stats
        method: GET
        path: stats
        auth: [admin, user, manager]
        handler: ./handlers/stats-handler.ts
        input:
          - { name: range, type: string, required: false }
      - name: reorder
        method: PATCH
        path: reorder
        auth: [admin, manager]
        handler: ./handlers/reorder-handler.ts
        input:
          - { name: items, type: json, required: true }
      - name: bulk-status
        method: PATCH
        path: bulk-status
        auth: [admin, user, manager]
        handler: ./handlers/bulk-status-handler.ts
        input:
          - { name: ids, type: json, required: true }
          - { name: status, type: enum, required: true }

    notifications:
      - name: notify-assignee
        trigger:
          on: afterCreate
          when: 'assigneeId != null'
        channel: email
        template: ./templates/task-assigned.hbs
        to: '${app.notificationEmail}'
        subject: 'Nueva tarea asignada: ${entity.title}'

      - name: notify-status-change
        trigger:
          on: afterUpdate
          when: 'changed.status != null'
        channel: email
        template: ./templates/task-assigned.hbs
        to: '${app.notificationEmail}'
        subject: 'Tarea "${entity.title}" cambió de estado'

      - name: notify-stale
        trigger:
          on: job
          jobName: stale-tasks-detector
        channel: email
        template: ./templates/stale-tasks.hbs
        to: '${app.notificationEmail}'
        subject: 'Tareas pendientes sin actualizar'

      - name: notify-overdue
        trigger:
          on: job
          jobName: overdue-tasks-detector
        channel: email
        template: ./templates/stale-tasks.hbs
        to: '${app.notificationEmail}'
        subject: 'Tareas vencidas'

    jobs:
      - name: stale-tasks-detector
        schedule: interval
        value: 60s
        handler: ./handlers/stale-tasks.handler.ts
        queue: spec-jobs
        retries: 3
        backoff: exponential

      - name: overdue-tasks-detector
        schedule: cron
        value: '0 8 * * *'
        handler: ./handlers/overdue-tasks.handler.ts
        queue: spec-jobs
        retries: 3
        backoff: fixed

    webhooks:
      - name: stale-alert
        path: tasks/webhooks/stale
        method: POST
        auth: hmac
        handler: ./handlers/stale-webhook.handler.ts

      - name: status-change
        path: tasks/webhooks/status-change
        method: POST
        auth: hmac
        handler: ./handlers/status-change-webhook.handler.ts

    seeds:
      - title: Setup project repository
        status: done
        priority: high
        position: 0
        estimateHours: 4
        isRecurring: false
        assigneeId: 1
        reporterId: 2
      - title: Design database schema
        status: in_progress
        priority: medium
        position: 1
        estimateHours: 8
        dueDate: '2026-08-10T00:00:00Z'
        assigneeId: 2
        reporterId: 1
      - title: Write API documentation
        status: pending
        priority: low
        position: 2
        estimateHours: 6
        assigneeId: 1
        reporterId: 1
      - title: Deploy staging environment
        status: blocked
        priority: urgent
        dueDate: '2026-08-15T00:00:00Z'
        position: 3
        estimateHours: 2
        assigneeId: 2
        reporterId: 1
      - title: Weekly metrics review
        status: pending
        priority: medium
        position: 4
        isRecurring: true
        recurrenceRule: 'FREQ=WEEKLY;BYDAY=MO'
        assigneeId: 1
        reporterId: 2
      - title: Refactor auth module
        status: review
        priority: high
        position: 5
        estimateHours: 16
        dueDate: '2026-08-20T00:00:00Z'
        assigneeId: 2
        reporterId: 1
      - title: Migrate to new S3 SDK
        status: in_progress
        priority: urgent
        position: 6
        estimateHours: 12
        assigneeId: 1
        reporterId: 2
      - title: Customer onboarding checklist
        status: pending
        priority: low
        position: 7
        isRecurring: true
        recurrenceRule: 'FREQ=MONTHLY;BYMONTHDAY=1'
        assigneeId: 2
        reporterId: 1