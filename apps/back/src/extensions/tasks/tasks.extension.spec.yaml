# ─── Tasks extension-level spec ─────────────────────────────────────────────
# This file defines extension-level concerns ONLY: name, version, displayName,
# description, custom roles, role seeds.
#
# The `resources:` array is intentionally EMPTY here — each resource lives in
# its own `*.spec.yaml` file (task.spec.yaml, task-comment.spec.yaml, etc.).
# The SpecLoader globs every `*.spec.yaml` in this directory and merges them
# via `mergeSpecs`. An empty `resources` array is required by the loader's
# file-validity check.
#
# Roles: `admin` and `user` are built-in. `manager` is a custom role declared
# here — the SpecValidator picks it up from ExtensionSpec.roles and accepts it
# in permissions lists / rowLevel keys / field-level permissions.

name: tasks
version: 2.0.0
displayName: Tasks
description: Kanban-style task management with stale/overdue alerts, attachments, activity log
author: Foundation

roles:
  - name: admin
    description: Full access to all tasks, comments, attachments, and dashboards.
    permissions: ['*']
  - name: user
    description: Can see tasks assigned to them; create comments; upload attachments.
    permissions: ['task.list', 'task.read', 'task-comment.create']
  - name: manager
    description: Team lead — sees assigned tasks plus the team-overview custom view.
    permissions: ['task.list', 'task.read', 'task.create', 'task.update', 'task-comment.update']

roleSeeds:
  - role: manager
    userId: 2
    description: 'Default manager role assignment for user #2'

resources: []