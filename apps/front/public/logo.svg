<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" role="img" aria-label="Foundation">
  <!-- Geometric foundation block: two stacked offset cubes + construction-orange accent bar. -->
  <!-- Icon block (scales cleanly at 24x24) -->
  <g>
    <!-- Back block (off-white) -->
    <path d="M8 10 L18 6 L18 18 L8 22 Z" fill="#F5F5F5"/>
    <path d="M18 6 L28 10 L28 22 L18 18 Z" fill="#D4D4D4"/>
    <path d="M8 22 L18 18 L28 22 L18 26 Z" fill="#A3A3A3"/>
    <!-- Front block (off-white, lower) -->
    <path d="M4 18 L14 14 L14 26 L4 30 Z" fill="#F5F5F5"/>
    <path d="M14 14 L24 18 L24 30 L14 26 Z" fill="#E5E5E5"/>
    <path d="M4 30 L14 26 L24 30 L14 34 Z" fill="#BFBFBF"/>
    <!-- Construction-orange accent bar (foundation rebar) -->
    <rect x="6" y="31.5" width="16" height="2.5" rx="0.5" fill="#F97316"/>
  </g>
  <!-- Wordmark -->
  <text x="34" y="26" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="0.5" fill="#F5F5F5">Foundation</text>
</svg>